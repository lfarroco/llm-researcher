name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          LLM_PROVIDER: "openai"
          LLM_MODEL: "gpt-4o"
          OPENAI_API_KEY: "sk-test"
          # Explicitly empty so a stray .env can never make CI hit a live API
          # or spend tokens. Must stay in sync with docs/HANDOFF.md §1.
          GROQ_API_KEY: ""
          TAVILY_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          SEMANTIC_SCHOLAR_API_KEY: ""
          SPRINGER_API_KEY: ""
          ELSEVIER_API_KEY: ""
          NCBI_API_KEY: ""
        run: pytest tests/ -v
